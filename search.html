<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Search — Vrark Art</title><link rel="stylesheet" href="styles.css"></head><body><div class="simple-page"><p class="section-kicker">Catalogue</p><h1>Search</h1><form class="catalogue-search" id="search-form"><input id="search-query" type="search" placeholder="Search animations, static art and gumps" aria-label="Search catalogue"><button type="submit">Search</button></form><p id="search-status">Enter a search term.</p><div class="notice-grid" id="search-results"></div></div></body></html>
<script src="subpage-nav.js"></script><script src="drive-catalogue.js"></script><script src="drive-contributors.js"></script><script src="drive-dates.js"></script><script src="static-catalogue.js"></script><script src="gump-catalogue.js"></script><script>
const fallback='assets/fallbacks/no-preview-available.png';
const direct=id=>id?'https://drive.google.com/uc?export=download&id='+encodeURIComponent(id):null;
const preview=id=>id?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w400':fallback;
const all=[...(window.VRARK_DRIVE_CATALOGUE||[]),...(window.VRARK_CONTRIBUTOR_CATALOGUE||[])].map(x=>Object.assign({kind:'Animation',contributor:'Vrark',date:window.VRARK_DRIVE_DATES?.[x.vdId]},x)).concat((window.VRARK_STATIC_CATALOGUE||[]).map(x=>Object.assign({kind:'Static art',date:x.createdTime||x.modifiedTime},x)),(window.VRARK_GUMP_CATALOGUE||[]).map(x=>Object.assign({kind:'Gump art',date:x.createdTime||x.modifiedTime},x)));
const form=document.querySelector('#search-form'), query=document.querySelector('#search-query'), status=document.querySelector('#search-status'), results=document.querySelector('#search-results');
function render(){const term=query.value.trim().toLowerCase();if(!term){status.textContent='Enter a search term.';results.innerHTML='';return;}const found=all.filter(x=>(x.name+' '+x.kind+' '+(x.contributor||'')).toLowerCase().includes(term)).sort((a,b)=>(Date.parse(b.date||0)||0)-(Date.parse(a.date||0)||0));status.textContent=found.length+' result'+(found.length===1?'':'s');results.innerHTML=found.map(item=>{const anim=item.kind==='Animation';return '<section class="notice-card"><h3 class="animation-title">'+item.name+'</h3><div class="animation-credit">'+item.kind+' · By '+(item.contributor||'Vrark')+'</div><div class="static-frame"><img src="'+preview(item.previewId)+'" alt="'+item.name+'"></div><p class="download-links"><a download href="'+direct(anim?item.vdId:item.id)+'">Download '+(anim?'.vd':'file')+'</a>'+(anim&&item.miniatureId?'<br><a download href="'+direct(item.miniatureId)+'">Download shrink miniature</a>':'')+'</p></section>';}).join('');}
form.addEventListener('submit',event=>{event.preventDefault();render();});
</script>
