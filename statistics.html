<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Statistics — Vrark Art</title><link rel="stylesheet" href="styles.css"></head><body><div class="simple-page"><h1>Statistics</h1><p class="statistics-line"><strong>Total uploads:</strong> <span id="uploads">…</span></p><p class="statistics-line"><strong>Contributors:</strong> <span id="contributors">…</span></p><p class="statistics-line"><strong>Days online:</strong> <span id="days">…</span></p><div class="category-winners"><p class="statistics-line"><strong>Most downloaded animation:</strong> <span id="top-animation">…</span></p><p class="statistics-line"><strong>Most downloaded static art:</strong> <span id="top-static">…</span></p><p class="statistics-line"><strong>Most downloaded gump art:</strong> <span id="top-gump">…</span></p></div><p class="statistics-line"><strong>Total downloads:</strong> <span id="downloads">…</span></p><h2 class="statistics-heading">Most downloaded items:</h2><div class="notice-grid" id="top-downloads">Loading…</div></div><script src="drive-catalogue.js"></script><script src="drive-contributors.js"></script><script src="static-catalogue.js"></script><script src="gump-catalogue.js"></script><script>document.addEventListener('DOMContentLoaded',function(){const all=[...(window.VRARK_DRIVE_CATALOGUE||[]),...(window.VRARK_CONTRIBUTOR_CATALOGUE||[]),...(window.VRARK_STATIC_CATALOGUE||[]),...(window.VRARK_GUMP_CATALOGUE||[])];const byId=new Map();all.forEach(x=>{if(x.vdId)byId.set(x.vdId,x);if(x.id)byId.set(x.id,x);});const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const preview=id=>id?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w400':'assets/fallbacks/no-preview-available.png';const direct=id=>'https://drive.google.com/uc?export=download&id='+encodeURIComponent(id);document.querySelector('#uploads').textContent=all.length;document.querySelector('#contributors').textContent=new Set(all.map(x=>x.contributor||'Vrark')).size;document.querySelector('#days').textContent=Math.max(0,Math.floor((Date.now()-new Date('2026-10-25T00:00:00Z'))/86400000));const e='https://vrark-art-counter.vrark-art.workers.dev';Promise.all([fetch(e+'/api/total-downloads').then(r=>r.json()),fetch(e+'/api/total-visits').then(r=>r.json()),fetch(e+'/api/top-downloads').then(r=>r.json())]).then(([d,v,t])=>{document.querySelector('#downloads').textContent=d.downloads||0;const winners={animation:null,static:null,gump:null};(t||[]).forEach(x=>{const i=byId.get(x.id);if(!i)return;const kind=i.vdId?'animation':(i.category&&/(static|sliced)/i.test(String(i.category))?'static':((window.VRARK_GUMP_CATALOGUE||[]).some(g=>g.id===x.id)?'gump':null));if(kind&&(!winners[kind]||x.downloads>winners[kind].downloads))winners[kind]={name:i.name,downloads:x.downloads};});document.querySelector('#top-animation').textContent=winners.animation?winners.animation.name+' ('+winners.animation.downloads+')':'None yet';document.querySelector('#top-static').textContent=winners.static?winners.static.name+' ('+winners.static.downloads+')':'None yet';document.querySelector('#top-gump').textContent=winners.gump?winners.gump.name+' ('+winners.gump.downloads+')':'None yet';const cards=(t||[]).map(x=>{const item=byId.get(x.id);if(!item)return '';const id=item.vdId||item.id;return '<section class="notice-card"><h3 class="animation-title">'+esc(item.name)+'</h3><div class="animation-credit">By '+esc(item.contributor||'Vrark')+'</div><div class="static-frame"><img src="'+preview(item.previewId)+'" alt="'+esc(item.name)+'"></div><p class="download-links"><a download href="'+direct(id)+'">Download '+(item.vdId?'.vd':'file')+'</a><span class="download-count">Total downloads: '+(x.downloads||0)+'</span></p></section>';}).join('');document.querySelector('#top-downloads').innerHTML=cards||'<p>No matching catalogue entries found.</p>';}).catch(()=>{document.querySelector('#top-downloads').innerHTML='<p>Statistics are temporarily unavailable.</p>';});});</script><script src="subpage-nav.js"></script></body></html>
