<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vrark Art — UO Animations</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="site-shell"><header class="top-banner"><img class="animated-gears" src="assets/legacy/gears-new.gif" alt="Animated gears"><img class="top-title" src="assets/legacy/top-title-v2.png?v=1" alt="Vrark art"></header>
<div class="site-body"><aside class="legacy-nav" aria-label="Creature navigation"><img src="assets/legacy/side-new.png" alt="Stone, chain and wood side panel"><nav class="menu-links"><a class="button-home" href="index.html"><img src="assets/buttons/home.png" alt="Home"></a><a class="button-animations" href="animations.html"><img src="assets/buttons/animations.png" alt="Animations"></a><a class="button-h-slot" href="animations.html?slot=H"><img src="assets/buttons/h-slot.png" alt="H slot"></a><a class="button-l-slot" href="animations.html?slot=L"><img src="assets/buttons/l-slot.png" alt="L slot"></a><a class="button-p-slot" href="animations.html?slot=P"><img src="assets/buttons/p-slot.png" alt="P slot"></a><a class="button-static" href="static-art.html"><img src="assets/buttons/static-art.png" alt="Static art"></a><a class="button-gump" href="gump-art.html"><img src="assets/buttons/gump-art.png" alt="Gump art"></a><a class="button-tools" href="tools.html"><img src="assets/buttons/tools.png" alt="Tools"></a><a class="button-tutorials" href="tutorials.html"><img src="assets/buttons/tutorials.png" alt="Tutorials"></a><a class="button-links" href="links.html"><img src="assets/buttons/links.png" alt="Links"></a></nav></aside>
<main class="content-panel"><div class="content-inner"><p class="section-kicker">Welcome</p><h1>Recent uploads</h1><p id="recent-status">Loading recent uploads…</p><div class="notice-grid" id="recent-uploads"></div></div></main></div><footer aria-label="Site footer"><a class="footer-search" href="search.html"><img src="assets/buttons/search.png" alt="Search"></a></footer></div>
<script src="drive-catalogue.js"></script><script src="drive-contributors.js"></script><script src="drive-dates.js"></script><script src="static-catalogue.js"></script><script src="gump-catalogue.js"></script><script>
const fallback='assets/fallbacks/no-preview-available.png';
const direct=id=>id?'https://drive.google.com/uc?export=download&id='+encodeURIComponent(id):null;
const preview=id=>id?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w400':fallback;
const animation=[...(window.VRARK_DRIVE_CATALOGUE||[]),...(window.VRARK_CONTRIBUTOR_CATALOGUE||[])].map(x=>Object.assign({kind:'Animation',contributor:'Vrark',date:window.VRARK_DRIVE_DATES?.[x.vdId]},x));
const staticArt=(window.VRARK_STATIC_CATALOGUE||[]).map(x=>Object.assign({kind:'Static art',date:x.createdTime||x.modifiedTime},x));
const gumps=(window.VRARK_GUMP_CATALOGUE||[]).map(x=>Object.assign({kind:'Gump art',date:x.createdTime||x.modifiedTime},x));
const assetName=value=>String(value||'').trim().toLowerCase();
const findRelated=(list,name)=>{const wanted=assetName(name),stripped=wanted.replace(/_(?:static|gump)$/,'');return (list||[]).find(x=>{const actual=assetName(x.name);return actual===wanted||actual===stripped||actual.replace(/_(?:static|gump)$/,'')===stripped;})||null;};
const relatedDownloads=item=>{if(item.kind!=='Animation'||!/(?:\s*-\s*|_)P$/i.test(item.name))return '';const base=item.name.replace(/(?:\s*-\s*|_)P$/i,'').trim();const s=findRelated(staticArt,base+'_static'),g=findRelated(gumps,base+'_gump');return (s?'<br><a download href="'+direct(s.id)+'">Download static item</a>':'')+(g?'<br><a download href="'+direct(g.id)+'">Download gump</a>':'');};
const recent=animation.concat(staticArt,gumps).sort((a,b)=>(Date.parse(b.date||0)||0)-(Date.parse(a.date||0)||0)).slice(0,10);
document.querySelector('#recent-status').textContent=recent.length+' recent uploads';
document.querySelector('#recent-uploads').innerHTML=recent.map(item=>{const isAnim=item.kind==='Animation';return '<section class="notice-card"><h3 class="animation-title">'+item.name+'</h3><div class="animation-credit">'+item.kind+' · By '+(item.contributor||'Vrark')+'</div><div class="static-frame"><img src="'+preview(item.previewId)+'" alt="'+item.name+'"></div><p class="download-links"><a download href="'+direct(isAnim?item.vdId:item.id)+'">Download '+(isAnim?'.vd':'file')+'</a>'+(isAnim&&item.miniatureId?'<br><a download href="'+direct(item.miniatureId)+'">Download shrink miniature</a>':'')+relatedDownloads(item)+'</p></section>';}).join('');
</script></body></html>
